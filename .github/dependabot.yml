# Dependabot proposes (in a PR) updating the dependencies once a month, grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Node's types describe the functions of ONE Node version: their major version has to be
      # the one of the Node that runs the project (mise.toml and .nvmrc). Bumped by hand, with Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript is pinned to 6 on purpose (decision 0001): typescript-eslint and
      # @astrojs/check do not support 7 yet. Bumped by hand, when they do.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
