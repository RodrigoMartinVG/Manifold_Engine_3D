# Dependabot propone (en un PR) actualizar las dependencias una vez por mes, agrupadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ['*']
    ignore:
      # Los tipos de Node describen las funciones de UNA versión de Node: su versión mayor tiene que
      # ser la del Node que corre el proyecto (mise.toml y .nvmrc). Se sube a mano, junto con Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript está fijado en la 6 a propósito (decisión 0001): typescript-eslint y
      # @astrojs/check todavía no soportan la 7. Se sube a mano, cuando la soporten.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
